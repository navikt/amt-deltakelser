---
kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: amt-distribusjon
  namespace: amt
  labels:
    team: amt
spec:
  port: 8080
  prometheus:
    enabled: true
    path: "/internal/prometheus"
  startup:
    path: "/internal/health/liveness"
    initialDelay: 20
    failureThreshold: 20
  readiness:
    path: "/internal/health/readiness"
  liveness:
    path: "/internal/health/liveness"
    timeout: 3
  resources:
    limits:
      memory: 1024Mi
  azure:
    application:
      enabled: true
  leaderElection: true
  accessPolicy:
    inbound:
      rules:
        - application: amt-deltaker-bff
        - application: amt-deltaker
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
