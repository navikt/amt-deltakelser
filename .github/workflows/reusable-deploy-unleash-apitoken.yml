name: Reusable Deploy Unleash API Token

on:
  workflow_call:
    inputs:
      module_path:
        required: true
        type: string

jobs:
  deploy-dev:
    name: Deploy ${{ inputs.module_path }} Unleash to dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Deploy to dev
        uses: nais/deploy/actions/deploy@1b32d71ce5c97174c039ac739b10220dab5a001f # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: ${{ inputs.module_path }}/.nais/unleash-apitoken-dev.yaml
          PRINT_PAYLOAD: true

  deploy-prod:
    name: Deploy ${{ inputs.module_path }} Unleash to prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Deploy to prod
        uses: nais/deploy/actions/deploy@1b32d71ce5c97174c039ac739b10220dab5a001f # v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: ${{ inputs.module_path }}/.nais/unleash-apitoken-prod.yaml