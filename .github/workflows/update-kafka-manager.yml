name: Update kafka-manager

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

concurrency:
  group: update-kafka-manager
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Find latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag=$(gh api repos/navikt/kafka-manager/releases/latest --jq '.tag_name')
          if [[ ! "$tag" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{2}\.[0-9]{2}-[0-9a-f]{7}$ ]]; then
            echo "::error::Unexpected kafka-manager release tag"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Update image tag
        env:
          IMAGE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          perl -0pi -e '
            $count = s{^  image: europe-north1-docker\.pkg\.dev/nais-management-233d/poao/kafka-manager:[^\s]+$}
              {"  image: europe-north1-docker.pkg.dev/nais-management-233d/poao/kafka-manager:" . $ENV{IMAGE_TAG}}gme;
            die "Expected exactly one kafka-manager image reference\n" unless $count == 1;
          ' amt-iac/kafka-manager/nais.yaml

      - name: Create or update pull request
        id: pull-request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          add-paths: amt-iac/kafka-manager/nais.yaml
          base: main
          branch: komet-bau/update-kafka-manager
          commit-message: |
            chore(amt-iac): update kafka-manager to ${{ steps.release.outputs.tag }}
          title: "chore(amt-iac): update kafka-manager to ${{ steps.release.outputs.tag }}"
          body: |
            Updates kafka-manager to [${{ steps.release.outputs.tag }}](https://github.com/navikt/kafka-manager/releases/tag/${{ steps.release.outputs.tag }}).

            The version comes from the latest non-prerelease GitHub release.
            No Artifact Registry lookup is needed.

            Merge manually to trigger the existing amt-iac deployment to dev and prod.
            Roll back by reverting the image tag change.

      - name: Summarize update
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PULL_REQUEST_URL: ${{ steps.pull-request.outputs.pull-request-url }}
        run: |
          {
            echo "kafka-manager release: $RELEASE_TAG"
            if [[ -n "$PULL_REQUEST_URL" ]]; then
              echo "Pull request: $PULL_REQUEST_URL"
            else
              echo "The image tag is already up to date."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
