name: CodeQL

on:
  merge_group:
  push:
    branches:
      - main
    paths:
      - "amt-deltaker/**"
      - "amt-deltaker-bff/**"
      - "amt-distribusjon/**"
      - "amt-felles/**"
      - "amt-lib/**"
      - "amt-tiltaksarrangor-bff/**"
      - "buildSrc/**"
      - "gradle/**"

  pull_request:
    branches:
      - main
    paths:
      - "amt-deltaker/**"
      - "amt-deltaker-bff/**"
      - "amt-distribusjon/**"
      - "amt-felles/**"
      - "amt-lib/**"
      - "amt-tiltaksarrangor-bff/**"
      - "buildSrc/**"
      - "gradle/**"

  schedule:
    - cron: '28 9 * * 2'  # Ukentlig full scan, tirsdager kl 09:28

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-and-quality

          # --no-parallel \
          # --no-build-cache \
      - name: Build project
        run: |
          ./gradlew assemble \
            -x test \
            --no-daemon \
            --no-configuration-cache

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"
          output: sarif-results
          upload: failure-only

      - name: Filter out false positives
        uses: advanced-security/filter-sarif@v1
        with:
          patterns: |
            -.gradle/**
            -buildSrc/**
          input: sarif-results/java.sarif
          output: sarif-results/java.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results/java.sarif

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: sarif-results
          path: sarif-results
          retention-days: 1
