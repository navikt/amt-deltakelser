name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '28 9 * * 2'  # Ukentlig full scan, tirsdager kl 09:28

permissions:
  contents: read
  security-events: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # vi bruker amt-deltaker-bff for endringer i felles-libs
            amt-deltaker-bff: 
              - amt-deltaker-bff/**
              - amt-felles/**
              - amt-lib/**
            amt-deltaker: amt-deltaker/**
            amt-distribusjon: amt-distribusjon/**
            amt-tiltaksarrangor-bff: amt-tiltaksarrangor-bff/**

      - name: Debug changed modules
        run: |
          echo "Changed modules raw output:"
          echo '${{ steps.filter.outputs.changes }}'

  codeql:
    needs: changes
    if: ${{ github.event_name == 'schedule' || needs.changes.outputs.modules != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ github.event_name == 'schedule' && fromJSON('["amt-deltaker-bff"]') || fromJSON(needs.changes.outputs.modules) }}
        language: [java-kotlin]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Build module(s) for CodeQL
        shell: bash
        run: ./gradlew :${{ matrix.module }}:assemble -x test --no-daemon --no-configuration-cache

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/module:${{ matrix.module }}/language:${{ matrix.language }}"