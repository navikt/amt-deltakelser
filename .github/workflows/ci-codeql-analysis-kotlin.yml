name: CodeQL Kotlin

on:
  merge_group:
  push:
    branches:
      - main
    paths:
      - "amt-aktivitetskort-publisher/**"
      - "amt-deltaker/**"
      - "amt-deltaker-bff/**"
      - "amt-distribusjon/**"
      - "amt-felles/**"
      - "amt-lib/**"
      - "amt-pdfgen/**"
      - "amt-tiltaksarrangor-bff/**"
      - "buildSrc/**"
      - "gradle/**"

  pull_request:
    branches:
      - main
    paths:
      - "amt-aktivitetskort-publisher/**"
      - "amt-deltaker/**"
      - "amt-deltaker-bff/**"
      - "amt-distribusjon/**"
      - "amt-felles/**"
      - "amt-lib/**"
      - "amt-pdfgen/**"
      - "amt-tiltaksarrangor-bff/**"
      - "buildSrc/**"
      - "gradle/**"

  schedule:
    - cron: '28 9 * * 2'  # Ukentlig full scan, tirsdager kl 09:28

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: java-kotlin
          queries: security-and-quality

      # Bygger kun classfiles — CodeQL trenger ikke resources, javadoc eller sources JARs.
      # --parallel og Gradle build-cache gir ~30-50% raskere bygg enn --no-build-cache.
      - name: Build project
        run: |
          ./gradlew classes \
            -x test \
            -x javadocJar \
            -x sourcesJar \
            --no-daemon \
            --no-configuration-cache \
            --parallel

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:java"
          output: sarif-results
          upload: failure-only

      - name: Filter out false positives
        uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
        with:
          patterns: |
            -.gradle/**
            -buildSrc/**
          input: sarif-results/java.sarif
          output: sarif-results/java.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: sarif-results/java.sarif

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-results
          path: sarif-results
          retention-days: 1
