name: CodeQL Kotlin

on:
  merge_group:
  push:
    branches:
      - main
    paths:
      - "amt-deltaker/**"
      - "amt-deltaker-bff/**"
      - "amt-distribusjon/**"
      - "amt-felles/**"
      - "amt-lib/**"
      - "amt-pdfgen/**"
      - "amt-tiltaksarrangor-bff/**"
      - "buildSrc/**"
      - "gradle/**"

  pull_request:
    branches:
      - main
    paths:
      - "amt-deltaker/**"
      - "amt-deltaker-bff/**"
      - "amt-distribusjon/**"
      - "amt-felles/**"
      - "amt-lib/**"
      - "amt-pdfgen/**"
      - "amt-tiltaksarrangor-bff/**"
      - "buildSrc/**"
      - "gradle/**"

  schedule:
    - cron: '28 9 * * 2'  # Ukentlig full scan, tirsdager kl 09:28

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: java-kotlin
          queries: security-and-quality

      # Bygger kun classfiles — CodeQL trenger ikke resources, javadoc eller sources JARs.
      # --parallel og Gradle build-cache gir ~30-50% raskere bygg enn --no-build-cache.
      - name: Build project
        run: |
          ./gradlew classes \
            -x test \
            -x javadocJar \
            -x sourcesJar \
            --no-daemon \
            --no-configuration-cache \
            --parallel

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:java"
          output: sarif-results
          upload: failure-only

      - name: Filter out false positives
        uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
        with:
          patterns: |
            -.gradle/**
            -buildSrc/**
          input: sarif-results/java.sarif
          output: sarif-results/java.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: sarif-results/java.sarif

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-results
          path: sarif-results
          retention-days: 1
