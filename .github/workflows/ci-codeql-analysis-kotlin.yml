name: CodeQL Kotlin

on:
  merge_group:
  push:
    branches:
      - main
    paths:
      - "amt-deltaker/**"
      - "amt-deltaker-bff/**"
      - "amt-distribusjon/**"
      - "amt-felles/**"
      - "amt-lib/**"
      - "amt-pdfgen/**"
      - "amt-tiltaksarrangor-bff/**"
      - "buildSrc/**"
      - "gradle/**"

  pull_request:
    branches:
      - main
    paths:
      - "amt-deltaker/**"
      - "amt-deltaker-bff/**"
      - "amt-distribusjon/**"
      - "amt-felles/**"
      - "amt-lib/**"
      - "amt-pdfgen/**"
      - "amt-tiltaksarrangor-bff/**"
      - "buildSrc/**"
      - "gradle/**"

  schedule:
    - cron: '28 9 * * 2'  # Ukentlig full scan, tirsdager kl 09:28

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: java-kotlin
          queries: security-and-quality

      # Bygger kun classfiles — CodeQL trenger ikke resources, javadoc eller sources JARs.
      # --parallel og Gradle build-cache gir ~30-50% raskere bygg enn --no-build-cache.
      - name: Build project
        run: |
          ./gradlew classes \
            -x test \
            -x javadocJar \
            -x sourcesJar \
            --no-daemon \
            --no-configuration-cache \
            --parallel

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: "/language:java"
          output: sarif-results
          upload: failure-only

      - name: Filter out false positives
        uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
        with:
          patterns: |
            -.gradle/**
            -buildSrc/**
          input: sarif-results/java.sarif
          output: sarif-results/java.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: sarif-results/java.sarif

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-results
          path: sarif-results
          retention-days: 1
