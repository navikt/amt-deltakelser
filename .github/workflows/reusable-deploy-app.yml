name: Reusable Deploy Application

on:
  workflow_call:
    inputs:
      module_path:
        required: true
        type: string

env:
  PRINT_PAYLOAD: true

permissions:
  id-token: write

jobs:
  test-build-and-push:
    name: Test, build and push ${{ inputs.module_path }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Setup Gradle to generate and submit dependency graphs
        uses: gradle/actions/setup-gradle@v5
        with:
          dependency-graph: generate-and-submit

      - name: Build artifacts
        run: |
          GRADLE_ARGS=""
          
          if [ "${{ inputs.module_path }}" != "amt-tiltaksarrangor-bff" ]; then
            GRADLE_ARGS="installDist"
          fi

          ./gradlew build \
            $GRADLE_ARGS \
            -p ${{ inputs.module_path }} \
            --no-daemon \
            --no-configuration-cache
# Kommenter inn ved behov
#            --info \
#            --console=plain \
#            --warning-mode=all

      - name: docker-build-push
        uses: nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: amt
          image_suffix: ${{ inputs.module_path }}
          tag: ${{ github.sha }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          docker_context: ${{ inputs.module_path }}
          dockerfile: ${{ inputs.module_path }}/Dockerfile
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

  deploy-dev:
    name: Deploy ${{ inputs.module_path }} to dev
    needs: test-build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy application
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: ${{ inputs.module_path }}/.nais/nais-dev.yaml
          VAR: image=${{ needs.test-build-and-push.outputs.image }}
          VARS: ${{ inputs.module_path }}/.nais/vars-dev.yaml

  deploy-prod:
    name: Deploy ${{ inputs.module_path }} to prod
    needs: [ test-build-and-push, deploy-dev ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy application
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: ${{ inputs.module_path }}/.nais/nais-prod.yaml
          VAR: image=${{ needs.test-build-and-push.outputs.image }}
          VARS: ${{ inputs.module_path }}/.nais/vars-prod.yaml