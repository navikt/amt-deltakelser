name: Deploy Application (Manual)

on:
  workflow_dispatch:
    inputs:
      module_path:
        description: Velg app
        required: true
        type: choice
        options:
          - amt-aktivitetskort-publisher
          - amt-deltaker-bff
          - amt-deltaker
          - amt-distribusjon
          - amt-pdfgen
          - amt-tiltaksarrangor-bff

permissions:
  contents: write    # Required for dependency-graph submit in reusable workflow
  id-token: write    # Required for NAIS deploy/docker-build-push in reusable workflow

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy-app.yml
    with:
      module_path: ${{ inputs.module_path }}