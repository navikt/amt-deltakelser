name: Deploy Application (Manual)

on:
  workflow_dispatch:
    inputs:
      module_path:
        description: Velg app
        required: true
        type: choice
        options:
          - Alle apper
          - amt-aktivitetskort-publisher
          - amt-deltaker-bff
          - amt-deltaker
          - amt-distribusjon
          - amt-pdfgen
          - amt-tiltaksarrangor-bff

permissions:
  contents: write
  id-token: write

jobs:
  deploy-single:
    if: ${{ inputs.module_path != 'Alle apper' }}
    uses: ./.github/workflows/reusable-deploy-app.yml
    with:
      module_path: ${{ inputs.module_path }}

  deploy-all:
    if: ${{ inputs.module_path == 'Alle apper' }}
    strategy:
      fail-fast: false
      matrix:
        module_path:
          - amt-aktivitetskort-publisher
          - amt-deltaker-bff
          - amt-deltaker
          - amt-distribusjon
          - amt-pdfgen
          - amt-tiltaksarrangor-bff
    uses: ./.github/workflows/reusable-deploy-app.yml
    with:
      module_path: ${{ matrix.module_path }}