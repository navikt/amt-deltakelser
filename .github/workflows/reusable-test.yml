name: Reusable Run Tests

on:
  workflow_call:
    inputs:
      module_path:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Run ${{ inputs.module_path }} tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run tests
        run: |
          GRADLE_ARGS=""
          
          if [ "${{ inputs.module_path }}" != "all" ]; then
            GRADLE_ARGS="-p ${{ inputs.module_path }}"
          fi
          
          ./gradlew check \
            $GRADLE_ARGS \
            --no-daemon \
            --no-configuration-cache
# Kommenter inn ved behov
#             --info \
#             --console=plain \
#             --warning-mode=all
