name: Reusable Run Tests

on:
  workflow_call:
    inputs:
      module_path:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Run ${{ inputs.module_path }} tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Run tests
        run: |
          GRADLE_ARGS=""
          
          if [ "${{ inputs.module_path }}" != "all" ]; then
            GRADLE_ARGS="-p ${{ inputs.module_path }}"
          fi
          
          ./gradlew check \
            $GRADLE_ARGS \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache
# Kommenter inn ved behov
#             --info \
#             --console=plain \
#             --warning-mode=all
