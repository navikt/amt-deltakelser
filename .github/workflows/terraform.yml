name: "Terraform"

on:
  push:
    paths:
      - "amt-bigquery-terraform/**"
      - ".github/workflows/terraform.yml"

env:
  DEV_DIR: './amt-bigquery-terraform/dev'
  PROD_DIR: './amt-bigquery-terraform/prod'

jobs:
  terraform-plan-dev:
    name: "terraform plan gcp-dev"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    concurrency: terraform-plan-dev
    defaults:
      run:
        working-directory: ${{ env.DEV_DIR }}

    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_SECRET_DEV }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run 'terraform setup'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.17.1

      - name: Run 'terraform init'
        run: terraform init -lockfile=readonly

      - name: Run 'terraform providers'
        run: terraform providers

      - name: Run 'terraform fmt'
        working-directory: ${{ github.workspace }}/amt-bigquery-terraform
        run: terraform fmt -check -recursive

      - name: Run 'terraform validate'
        run: terraform validate

      - name: Run 'terraform plan'
        run: terraform plan

  terraform-plan-prod:
    name: "terraform plan gcp-prod"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    concurrency: terraform-plan-prod
    defaults:
      run:
        working-directory: ${{ env.PROD_DIR }}

    steps:
      - name: "Checkout code"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2
        with:
          workload_identity_provider: projects/337368476147/locations/global/workloadIdentityPools/github/providers/github-action
          service_account: amt-terraform@amt-prod-d4dd.iam.gserviceaccount.com

      - name: Run 'terraform setup'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.17.1

      - name: Run 'terraform init'
        run: terraform init -lockfile=readonly

      - name: Run 'terraform fmt'
        working-directory: ${{ github.workspace }}/amt-bigquery-terraform
        run: terraform fmt -check -recursive

      - name: Run 'terraform validate'
        run: terraform validate

      - name: Run 'terraform plan'
        run: terraform plan

  terraform-apply-dev:
    needs: terraform-plan-dev
    if: github.ref_name == 'main' || startsWith(github.ref_name, 'dev-')
    name: "terraform apply gcp-dev"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    concurrency: terraform-plan-dev, terraform-apply-dev
    defaults:
      run:
        working-directory: ${{ env.DEV_DIR }}

    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_SECRET_DEV }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run 'terraform setup'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.17.1

      - name: Run 'terraform init'
        run: terraform init -lockfile=readonly

      - name: Run 'terraform apply'
        run: terraform apply -auto-approve

  terraform-apply-prod:
    needs: terraform-plan-prod
    if: github.ref_name == 'main'
    name: "terraform apply gcp-prod"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    concurrency: terraform-plan-prod, terraform-apply-prod
    defaults:
      run:
        working-directory: ${{ env.PROD_DIR }}

    steps:
      - name: "Checkout code"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2
        with:
          workload_identity_provider: projects/337368476147/locations/global/workloadIdentityPools/github/providers/github-action
          service_account: amt-terraform@amt-prod-d4dd.iam.gserviceaccount.com

      - name: Run 'terraform setup'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.17.1

      - name: Run 'terraform init'
        run: terraform init -lockfile=readonly

      - name: Run 'terraform apply'
        run: terraform apply -auto-approve
