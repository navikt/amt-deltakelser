name: Run Tests

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      modules: >-
        ${{ contains(fromJSON(steps.filter.outputs.changes), 'all')
          && '[
            "amt-aktivitetskort-publisher",
            "amt-deltaker-bff",
            "amt-deltaker",
            "amt-distribusjon",
            "amt-felles",
            "amt-lib",
            "amt-pdfgen",
            "amt-tiltaksarrangor-bff"
          ]'
          || steps.filter.outputs.changes }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            amt-aktivitetskort-publisher: amt-aktivitetskort-publisher/**
            amt-deltaker-bff: amt-deltaker-bff/**
            amt-deltaker: amt-deltaker/**
            amt-distribusjon: amt-distribusjon/**
            amt-felles: amt-felles/**
            amt-lib: amt-lib/**
            amt-pdfgen: amt-pdfgen/**
            amt-tiltaksarrangor-bff: amt-tiltaksarrangor-bff/**
            all:
              - .github/workflows/ci-run-tests.yml
              - .github/workflows/reusable-test.yml
              - gradle/**
              - gradle.properties
              - gradlew
              - settings.gradle.kts
              - amt-felles/**
              - amt-lib/**
              - buildSrc/**

      - name: Debug changed modules
        run: |
          echo "Changed modules raw output:"
          echo '${{ steps.filter.outputs.changes }}'

  run-tests:
    needs: changes
    if: ${{ needs.changes.outputs.modules != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    uses: ./.github/workflows/reusable-test.yml
    with:
      module_path: ${{ matrix.module }}