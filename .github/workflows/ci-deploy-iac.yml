name: Deploy amt-iac

on:
  push:
    branches:
      - main
    paths:
      - "amt-iac/**/*.yaml"
      - ".github/workflows/ci-deploy-iac.yml"

jobs:
  changes:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      iac_folders: ${{ steps.filter.outputs.changes }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            alerts/dev:
              - amt-iac/alerts/dev/**
            alerts/prod:
              - amt-iac/alerts/prod/**
            kafka-manager/dev:
              - amt-iac/kafka-manager/dev/**
            kafka-manager/prod:
              - amt-iac/kafka-manager/prod/**
            kafka-topic/dev:
              - amt-iac/kafka-topic/dev/**
            kafka-topic/prod:
              - amt-iac/kafka-topic/prod/**

      - name: Debug changed environments
        run: echo '${{ steps.filter.outputs.changes }}'

  deploy:
    needs: changes
    if: ${{ needs.changes.outputs.iac_folders != '[]' }}

    strategy:
      matrix:
        iac_folder: ${{ fromJSON(needs.changes.outputs.iac_folders) }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: List resource files
        run: echo "RESOURCE_FILES=$(find amt-iac/${{ matrix.iac_folder }} -type f -name '*.yaml' -printf '%p,' | sed 's/,$//')" >> $GITHUB_ENV

      - name: Deploy ${{ matrix.iac_folder }}
        if: ${{ endsWith(matrix.iac_folder, '/dev') }}
        uses: nais/deploy/actions/deploy@5fdd91aaf69bb0d6dd5e5118cdacb639f487b93b # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: ${{ env.RESOURCE_FILES }}
          PRINT_PAYLOAD: true

      - name: Deploy ${{ matrix.iac_folder }}
        if: ${{ github.ref == 'refs/heads/main' && endsWith(matrix.iac_folder, '/prod') }}
        uses: nais/deploy/actions/deploy@5fdd91aaf69bb0d6dd5e5118cdacb639f487b93b # v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: ${{ env.RESOURCE_FILES }}
          PRINT_PAYLOAD: true