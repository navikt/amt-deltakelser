name: Deploy amt-iac

on:
  push:
    branches:
      - main
    paths:
      - "amt-iac/**/*.yaml"
      - ".github/workflows/ci-deploy-iac.yml"

jobs:
  changes:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      iac_folders: ${{ steps.filter.outputs.changes }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            alerts/dev:
              - amt-iac/alerts/dev/**
            alerts/prod:
              - amt-iac/alerts/prod/**
            kafka-manager/dev:
              - amt-iac/kafka-manager/nais.yaml
              - amt-iac/kafka-manager/vars-dev.yaml
            kafka-manager/prod:
              - amt-iac/kafka-manager/nais.yaml
              - amt-iac/kafka-manager/vars-prod.yaml
            kafka-topic/dev:
              - amt-iac/kafka-topic/dev/**
            kafka-topic/prod:
              - amt-iac/kafka-topic/prod/**

      - name: Debug changed environments
        run: echo '${{ steps.filter.outputs.changes }}'

  deploy:
    needs: changes
    if: ${{ needs.changes.outputs.iac_folders != '[]' }}

    strategy:
      matrix:
        iac_folder: ${{ fromJSON(needs.changes.outputs.iac_folders) }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List resource files
        env:
          IAC_FOLDER: ${{ matrix.iac_folder }}
        run: |
          if [[ "$IAC_FOLDER" == kafka-manager/* ]]; then
            echo "RESOURCE_FILES=amt-iac/kafka-manager/nais.yaml" >> "$GITHUB_ENV"
            echo "VARS_FILE=amt-iac/kafka-manager/vars-${IAC_FOLDER##*/}.yaml" >> "$GITHUB_ENV"
          else
            echo "RESOURCE_FILES=$(find "amt-iac/$IAC_FOLDER" -type f -name '*.yaml' -printf '%p,' | sed 's/,$//')" >> "$GITHUB_ENV"
          fi

      - name: Deploy ${{ matrix.iac_folder }}
        if: ${{ endsWith(matrix.iac_folder, '/dev') }}
        uses: nais/deploy/actions/deploy@1064e26587ab2794266a35f477387e561899a7ef # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: ${{ env.RESOURCE_FILES }}
          VARS: ${{ env.VARS_FILE }}
          PRINT_PAYLOAD: true

      - name: Deploy ${{ matrix.iac_folder }}
        if: ${{ github.ref == 'refs/heads/main' && endsWith(matrix.iac_folder, '/prod') }}
        uses: nais/deploy/actions/deploy@1064e26587ab2794266a35f477387e561899a7ef # v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: ${{ env.RESOURCE_FILES }}
          VARS: ${{ env.VARS_FILE }}
          PRINT_PAYLOAD: true