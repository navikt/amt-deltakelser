spring.main.allow-bean-definition-overriding=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9999/tokenx
spring.security.oauth2.resourceserver.jwt.audiences=amt-tiltaksarrangor-bff-client-id

spring.security.oauth2.client.provider.tokenx.token-uri=http://localhost:9999/tokenx/token
spring.security.oauth2.client.provider.azuread.token-uri=http://localhost:9999/azuread/token

spring.security.oauth2.client.registration.amt-arrangor-tokenx.provider=tokenx
spring.security.oauth2.client.registration.amt-arrangor-tokenx.client-id=amt-tiltaksarrangor-bff
spring.security.oauth2.client.registration.amt-arrangor-tokenx.client-secret=test-secret
spring.security.oauth2.client.registration.amt-arrangor-tokenx.authorization-grant-type=urn:ietf:params:oauth:grant-type:token-exchange
spring.security.oauth2.client.registration.amt-arrangor-tokenx.scope=amt-arrangor

spring.security.oauth2.client.registration.amt-arrangor-aad.provider=azuread
spring.security.oauth2.client.registration.amt-arrangor-aad.client-id=test
spring.security.oauth2.client.registration.amt-arrangor-aad.client-secret=test-secret
spring.security.oauth2.client.registration.amt-arrangor-aad.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.amt-arrangor-aad.scope=amt-arrangor

spring.security.oauth2.client.registration.amt-person-aad.provider=azuread
spring.security.oauth2.client.registration.amt-person-aad.client-id=test
spring.security.oauth2.client.registration.amt-person-aad.client-secret=test-secret
spring.security.oauth2.client.registration.amt-person-aad.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.amt-person-aad.scope=amt-person

spring.http.serviceclient.amt-arrangor-tokenx.base-url=http://localhost:8080
spring.http.serviceclient.amt-arrangor-aad.base-url=http://localhost:8080
spring.http.serviceclient.amt-person-aad.base-url=http://localhost:8080

app.env.unleashUrl=https://amt-unleash.nais.io/api/
app.env.unleashApiToken=token

kafka.enabled=false
kafka.auto-offset-reset=latest
spring.autoconfigure.exclude=org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration

elector.path=dont_look_for_leader