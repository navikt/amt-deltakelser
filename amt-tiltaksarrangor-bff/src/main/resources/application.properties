spring.main.banner-mode=off
spring.threads.virtual.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=10s

management.endpoint.prometheus.access=read_only
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoints.web.base-path=/internal
management.endpoints.web.exposure.include=prometheus,health
management.prometheus.metrics.export.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${TOKEN_X_WELL_KNOWN_URL}
spring.security.oauth2.resourceserver.jwt.audiences=${TOKEN_X_CLIENT_ID}

spring.security.oauth2.client.provider.tokenx.token-uri=${TOKEN_X_TOKEN_ENDPOINT}
spring.security.oauth2.client.provider.azuread.token-uri=${AZURE_OPENID_CONFIG_TOKEN_ENDPOINT}

spring.http.serviceclient.amt-arrangor-tokenx.base-url=${AMT_ARRANGOR_URL:http://amt-arrangor}
spring.http.serviceclient.amt-arrangor-aad.base-url=${AMT_ARRANGOR_URL:http://amt-arrangor}/api/service/arrangor/organisasjonsnummer
spring.http.serviceclient.amt-person-aad.base-url=${AMT_PERSON_URL:http://amt-person-service}

spring.security.oauth2.client.registration.amt-arrangor-tokenx.provider=tokenx
spring.security.oauth2.client.registration.amt-arrangor-tokenx.client-id=${TOKEN_X_CLIENT_ID}
spring.security.oauth2.client.registration.amt-arrangor-tokenx.client-secret=${TOKEN_X_PRIVATE_JWK}
spring.security.oauth2.client.registration.amt-arrangor-tokenx.client-authentication-method=private_key_jwt
spring.security.oauth2.client.registration.amt-arrangor-tokenx.authorization-grant-type=urn:ietf:params:oauth:grant-type:token-exchange
spring.security.oauth2.client.registration.amt-arrangor-tokenx.scope=${AMT_ARRANGOR_TOKENX_CLIENT_ID}

spring.security.oauth2.client.registration.amt-arrangor-aad.provider=azuread
spring.security.oauth2.client.registration.amt-arrangor-aad.client-id=${AZURE_APP_CLIENT_ID}
spring.security.oauth2.client.registration.amt-arrangor-aad.client-secret=${AZURE_APP_CLIENT_SECRET}
spring.security.oauth2.client.registration.amt-arrangor-aad.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.amt-arrangor-aad.scope=${AMT_ARRANGOR_AAD_CLIENT_ID}

spring.security.oauth2.client.registration.amt-person-aad.provider=azuread
spring.security.oauth2.client.registration.amt-person-aad.client-id=${AZURE_APP_CLIENT_ID}
spring.security.oauth2.client.registration.amt-person-aad.client-secret=${AZURE_APP_CLIENT_SECRET}
spring.security.oauth2.client.registration.amt-person-aad.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.amt-person-aad.scope=${AMT_PERSON_AAD_CLIENT_ID}

app.env.unleashUrl=${UNLEASH_SERVER_API_URL}/api
app.env.unleashApiToken=${UNLEASH_SERVER_API_TOKEN}

spring.datasource.url=${DB_JDBC_URL}
spring.datasource.hikari.maximum-pool-size=3
spring.flyway.postgresql.transactional-lock=false

kafka.auto-offset-reset=earliest

rest.include-stacktrace=false