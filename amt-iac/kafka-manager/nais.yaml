kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: amt-kafka-manager
  namespace: amt
  labels:
    team: amt
spec:
  image: europe-north1-docker.pkg.dev/nais-management-233d/poao/kafka-manager:2026.11.12-13.53-b8d2e80
  port: 8080
  webproxy: true
  prometheus:
    enabled: true
    path: /internal/prometheus

  startup:
    path: /internal/health/liveness
    initialDelay: 20
    failureThreshold: 20
  readiness:
    path: /internal/health/readiness
  liveness:
    path: /internal/health/liveness

  replicas:
    min: 1
    max: 1 # 1 instance is required since in-memory session management is used
    disableAutoScaling: true
