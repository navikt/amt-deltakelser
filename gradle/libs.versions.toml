[versions]
kotlin-version = "2.3.21"
ktor-version = "3.4.2"
logback-version = "1.5.32"
logstash-encoder-version = "9.0"
prometheus-version = "1.16.5"
ktlint-version = "14.0.1"
ktlint-cli-version = "1.8.0"
jackson2-version = "2.21.3"
nav-common-version = "3.2025.10.10_08.21-bb7c7830d93c"
poao-tilgang-version = "2025.11.03_14.33-9c5783f38a9a"
kotest-version = "6.1.11"
flyway-version = "12.5.0"
hikari-version = "7.0.2"
kotliquery-version = "1.9.1"
postgres-version = "42.7.11"
caffeine-version = "3.2.3"
mockk-version = "1.14.9"
nimbus-version = "10.9"
unleash-version = "12.2.1"
tms-varsel-kotlin-builder-version = "2.2.0"

# amt-lib spesifikt
kafka-clients-version = "4.2.0"
kotlinx-version = "1.10.2"
prometheus-metrics-version = "1.6.1"
okhttp-version = "5.3.2"
jupiter-version = "6.0.3"
testcontainers-version = "2.0.5"

# spring-boot specifikt
spring-boot-version = "4.0.6"
spring-dependency-management-version = "1.1.7"
tools-jackson-version = "3.1.2"
token-support-version = "6.0.6"
shedlock-spring-version = "7.7.0"
springmockk-version = "5.0.1"

# amt-pdfgen spesifikt
jsoup-version = "1.22.2"
pdfgen-core-version = "1.1.79"


# CVE-fixes
netty-codec-http2-version = "4.2.12.Final"

[libraries]

# CVE-fixes
# fikser CVE-2023-3635 ved å gjøre en oppgradering av okhttp som er en transitive dependency av unleash
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp-version" }
netty-codec-http2 = { module = "io.netty:netty-codec-http2", version.ref = "netty-codec-http2-version" }
tools-jackson-core = { module = "tools.jackson.core:jackson-core", version.ref = "tools-jackson-version" }

# amt-pdfgen spesifikt (bruker Jackson 2 via pdfgen-core)
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup-version" }
pdfgen-core = { module = "no.nav.pdfgen:pdfgen-core", version.ref = "pdfgen-core-version" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson2-version" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson2-version" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson2-version" }

# spring-boot spesifikt
tools-jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "tools-jackson-version" }
token-validation-spring = { module = "no.nav.security:token-validation-spring", version.ref = "token-support-version" }
token-client-spring = { module = "no.nav.security:token-client-spring", version.ref = "token-support-version" }
token-validation-spring-test = { module = "no.nav.security:token-validation-spring-test", version.ref = "token-support-version" }
shedlock-spring = { module = "net.javacrumbs.shedlock:shedlock-spring", version.ref = "shedlock-spring-version" }
shedlock-jdbc-template = { module = "net.javacrumbs.shedlock:shedlock-provider-jdbc-template", version.ref = "shedlock-spring-version" }
springmockk = { module = "com.ninja-squad:springmockk", version.ref = "springmockk-version" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp-version" }

# amt-lib spesifikt
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka-clients-version" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-version" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-version" }
prometheus-metrics-instrumentation = { module = "io.prometheus:prometheus-metrics-instrumentation-jvm", version.ref = "prometheus-metrics-version" }
prometheus-metrics-exporter = { module = "io.prometheus:prometheus-metrics-exporter-httpserver", version.ref = "prometheus-metrics-version" }

ktor-server-core = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor-version" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "jupiter-version" }

testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers-version" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka", version.ref = "testcontainers-version" }

# --- BOM ---
ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor-version" }

# --- Ktor Server ---
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation-jvm" }
ktor-serialization-jackson = { module = "io.ktor:ktor-serialization-jackson3-jvm" }
ktor-server-call-id = { module = "io.ktor:ktor-server-call-id-jvm" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging-jvm" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth" }
ktor-server-metrics = { module = "io.ktor:ktor-server-metrics-micrometer-jvm" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages-jvm" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty-jvm" }
ktor-server-request-validation = { module = "io.ktor:ktor-server-request-validation" }

# --- Ktor Client ---
ktor-client-core = { module = "io.ktor:ktor-client-core" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation" }

# --- Metrics ---
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "prometheus-version" }

# --- Logging ---
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback-version" }
logstash-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-encoder-version" }
nav-common-log = { module = "no.nav.common:log", version.ref = "nav-common-version" }
nav-common-audit-log = { module = "no.nav.common:audit-log", version.ref = "nav-common-version" }

# --- POAO ---
poao-tilgang-client = { module = "no.nav.poao-tilgang:client", version.ref = "poao-tilgang-version" }

# --- TMS Varsel Kotlin Builder ---
tms-varsel-kotlin-builder = { module = "no.nav.tms.varsel:kotlin-builder", version.ref = "tms-varsel-kotlin-builder-version" }

# --- Database ---
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari-version" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway-version" }
flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway-version" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgres-version" }
kotliquery = { module = "com.github.seratch:kotliquery", version.ref = "kotliquery-version" }

# --- Cache ---
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine-version" }

# --- Feature Toggle ---
unleash = { module = "io.getunleash:unleash-client-java", version.ref = "unleash-version" }

# --- Test ---
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin-version" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5-jvm", version.ref = "kotest-version" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core-jvm", version.ref = "kotest-version" }
kotest-assertions-json = { module = "io.kotest:kotest-assertions-json-jvm", version.ref = "kotest-version" }
kotest-assertions-table = { module = "io.kotest:kotest-assertions-table-jvm", version.ref = "kotest-version" }

mockk = { module = "io.mockk:mockk-jvm", version.ref = "mockk-version" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-version" }

# plugins used in convention plugin
kotlin-jvm = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin-version" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle.ktlint:org.jlleitschuh.gradle.ktlint.gradle.plugin", version.ref = "ktlint-version" }
ktor-plugin = { module = "io.ktor.plugin:io.ktor.plugin.gradle.plugin", version.ref = "ktor-version" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot-version" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management-version" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin-version" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-version" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor-version" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-version" }

[bundles]
ktor-server = [
    "ktor-server-content-negotiation",
    "ktor-serialization-jackson",
    "ktor-server-call-id",
    "ktor-server-call-logging",
    "ktor-server-auth",
    "ktor-server-metrics",
    "ktor-server-status-pages",
    "ktor-server-auth-jwt",
    "ktor-server-netty",
    "ktor-server-request-validation"
]

ktor-client = [
    "ktor-client-core",
    "ktor-client-cio",
    "ktor-client-content-negotiation"
]

database = [
    "hikari",
    "flyway-core",
    "flyway-postgres",
    "postgresql",
    "kotliquery"
]

logging = [
    "logback-classic",
    "logstash-encoder",
    "nav-common-log"
]

ktor-test = [
    "ktor-server-test-host",
    "ktor-client-mock"
]

kotest = [
    "kotest-assertions-core",
    "kotest-assertions-json"
]
