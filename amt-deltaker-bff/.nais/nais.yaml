---
kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: amt-deltaker-bff
  namespace: amt
  labels:
    team: amt
spec:
  port: 8080
  prometheus:
    enabled: true
    path: "/internal/prometheus"
  startup:
    path: "/internal/health/liveness"
    initialDelay: 20
    failureThreshold: 20
  readiness:
    path: "/internal/health/readiness"
  liveness:
    path: "/internal/health/liveness"
  envFrom:
    - secret: amt-deltaker-bff-unleash-api-token
  azure:
    application:
      enabled: true
      allowAllUsers: true
    sidecar:
      enabled: true
  leaderElection: true
  tokenx:
    enabled: true
  accessPolicy:
    outbound:
      rules:
        - application: amt-arrangor
        - application: amt-person-service
        - application: amt-deltaker
        - application: amt-distribusjon
        - application: poao-tilgang
          namespace: poao
        - application: mulighetsrommet-api
          namespace: team-mulighetsrommet
      external:
        - host: amt-unleash-api.nav.cloud.nais.io
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
