nais.env.azureAppClientId=test

spring.main.allow-bean-definition-overriding=true

kafka.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration

spring.security.oauth2.client.provider.azuread.token-uri=http://localhost:9999/token
spring.security.oauth2.client.registration.amt-arena-acl.provider=azuread
spring.security.oauth2.client.registration.amt-arena-acl.client-id=test
spring.security.oauth2.client.registration.amt-arena-acl.client-secret=test-secret
spring.security.oauth2.client.registration.amt-arena-acl.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.amt-arena-acl.scope=api://test/.default
spring.security.oauth2.client.registration.amt-arrangor.provider=azuread
spring.security.oauth2.client.registration.amt-arrangor.client-id=test
spring.security.oauth2.client.registration.amt-arrangor.client-secret=test-secret
spring.security.oauth2.client.registration.amt-arrangor.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.amt-arrangor.scope=api://test/.default
spring.security.oauth2.client.registration.aktivitet-arena-acl.provider=azuread
spring.security.oauth2.client.registration.aktivitet-arena-acl.client-id=test
spring.security.oauth2.client.registration.aktivitet-arena-acl.client-secret=test-secret
spring.security.oauth2.client.registration.aktivitet-arena-acl.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.aktivitet-arena-acl.scope=api://test/.default
spring.security.oauth2.client.registration.veilarboppfolging.provider=azuread
spring.security.oauth2.client.registration.veilarboppfolging.client-id=test
spring.security.oauth2.client.registration.veilarboppfolging.client-secret=test-secret
spring.security.oauth2.client.registration.veilarboppfolging.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.veilarboppfolging.scope=api://test/.default

spring.http.serviceclient.amt-arena-acl.base-url=http://localhost:8080
spring.http.serviceclient.amt-arrangor.base-url=http://localhost:8080
spring.http.serviceclient.aktivitet-arena-acl.base-url=http://localhost:8080
spring.http.serviceclient.veilarboppfolging.base-url=http://localhost:8080

app.env.unleashUrl=https://amt-unleash.nais.io/api/
app.env.unleashApiToken=token

veilederurl.basepath=https://intern.veileder
deltakerurl.basepath=https://ekstern.deltaker
