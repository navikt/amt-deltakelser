---
kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: amt-aktivitetskort-publisher
  namespace: amt
  labels:
    team: amt
spec:
  port: 8080
  prometheus:
    enabled: true
    port: '8081'
    path: "/actuator/prometheus"
  startup:
    port: 8081
    path: "/actuator/health/liveness"/quit
    initialDelay: 20
    failureThreshold: 20
  readiness:
    port: 8081
    path: "/actuator/health/readiness"
  liveness:
    port: 8081
    path: "/actuator/health/liveness"
  replicas:
    min: 1
  resources:
    requests:
      cpu: 10m
  azure:
    application:
      enabled: true
  accessPolicy:
    outbound:
      external:
        - host: amt-unleash-api.nav.cloud.nais.io
  envFrom:
    - secret: amt-aktivitetskort-publisher-unleash-api-token
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
