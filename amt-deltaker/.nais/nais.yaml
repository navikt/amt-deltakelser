kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: amt-deltaker
  namespace: amt
  labels:
    team: amt
spec:
  image: {{image}}
  port: 8080
  ingresses:
    - {{ingress}}
  prometheus:
    enabled: true
    path: /internal/prometheus

  startup:
    path: /internal/health/liveness
    initialDelay: 20
    failureThreshold: 20
  readiness:
    path: /internal/health/readiness
  liveness:
    path: /internal/health/liveness

  replicas:
    min: {{replicas_min}}
    max: {{replicas_max}}
{{#if cpu_scaling_threshold}}
    scalingStrategy:
      cpu:
        thresholdPercentage: {{cpu_scaling_threshold}}
{{else}}
    disableAutoScaling: true
{{/if}}
  resources:
    requests:
      cpu: {{cpu_request}}
      memory: {{memory_request}}
    limits:
      memory: {{memory_limit}}
  envFrom:
    - secret: amt-deltaker-unleash-api-token
  azure:
    application:
      enabled: true
      allowAllUsers: true
  accessPolicy:
    inbound:
      rules:
        - application: amt-deltaker-bff
        - application: amt-tiltaksarrangor-bff
        - application: amt-distribusjon
        - application: mulighetsrommet-api
          namespace: team-mulighetsrommet
        - application: veilarboppfolging
          namespace: poao
          cluster: {{cluster}}
    outbound:
      rules:
        - application: amt-person-service
        - application: amt-arrangor
        - application: amt-tiltak
        - application: amt-distribusjon
        - application: poao-tilgang
          namespace: poao
        - application: isoppfolgingstilfelle
          namespace: teamsykefravr
        - application: mulighetsrommet-api
          namespace: team-mulighetsrommet
      external:
        - host: amt-unleash-api.nav.cloud.nais.io
  leaderElection: true
  kafka:
    pool: {{kafka_pool}}
  env:
    - name: JDK_JAVA_OPTIONS
      value: "-XX:MaxRAMPercentage=80.0 -Xshare:off --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow"
    - name: AMT_PERSONSERVICE_SCOPE
      value: api://{{cluster}}.amt.amt-person-service/.default
    - name: AMT_PERSONSERVICE_URL
      value: http://amt-person-service
    - name: AMT_ARRANGOR_SCOPE
      value: api://{{cluster}}.amt.amt-arrangor/.default
    - name: AMT_ARRANGOR_URL
      value: http://amt-arrangor
    - name: AMT_TILTAK_SCOPE
      value: api://{{cluster}}.amt.amt-tiltak/.default
    - name: AMT_TILTAK_URL
      value: http://amt-tiltak
    - name: POAO_TILGANG_SCOPE
      value: api://{{cluster}}.poao.poao-tilgang/.default
    - name: POAO_TILGANG_URL
      value: http://poao-tilgang.poao
    - name: ISOPPFOLGINGSTILFELLE_SCOPE
      value: api://{{cluster}}.teamsykefravr.isoppfolgingstilfelle/.default
    - name: ISOPPFOLGINGSTILFELLE_URL
      value: http://isoppfolgingstilfelle.teamsykefravr
    - name: AMT_DISTRIBUSJON_SCOPE
      value: api://{{cluster}}.amt.amt-distribusjon/.default
    - name: AMT_DISTRIBUSJON_URL
      value: http://amt-distribusjon
    - name: MULIGHETSROMMET_API_SCOPE
      value: api://{{cluster}}.team-mulighetsrommet.mulighetsrommet-api/.default
    - name: MULIGHETSROMMET_API_URL
      value: http://mulighetsrommet-api.team-mulighetsrommet.svc.cluster.local

  gcp:
    sqlInstances:
      - name: {{database_instance}}
        collation: nb_NO.UTF8
        tier: {{database_tier}}
{{#if database_disk_size}}
        diskSize: {{database_disk_size}}
{{/if}}
        type: POSTGRES_17
        databases:
          - name: amt-deltaker
            envVarPrefix: DB
            users:
{{#each database_users}}
              - name: {{name}}
{{/each}}
        flags:
{{#each database_flags}}
          - name: {{name}}
            value: "{{value}}"
{{/each}}
        diskAutoresize: {{database_disk_autoresize}}
        pointInTimeRecovery: {{database_point_in_time_recovery}}
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
